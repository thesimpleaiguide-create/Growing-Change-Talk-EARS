<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing Change Talk: EARS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ttnNavy: '#0C2340',
                        ttnTrustBlue: '#005EB8',
                        ttnActionOrange: '#FE5000',
                        ttnSlate: '#333F48',
                        ttnIceBlue: '#DBE2E9'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .ears-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ears-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        /* State visibility toggling */
        .show-patient .patient-video { opacity: 1; z-index: 20; }
        .show-patient .sequence-video { opacity: 0; z-index: 10; }

        .show-sequence .patient-video { opacity: 0; z-index: 10; }
        .show-sequence .sequence-video { opacity: 1; z-index: 20; transform: scale(1.02); }
    </style>
</head>
<body class="bg-transparent m-0 p-4 md:p-8 font-sans text-ttnSlate antialiased w-full min-h-screen flex flex-col items-center justify-center">

    <div class="max-w-5xl w-full mx-auto space-y-8">
        
        <!-- Header Section -->
        <div class="text-center space-y-3">
            <h2 class="text-3xl md:text-4xl font-bold text-ttnNavy tracking-tight">Growing Change Talk: EARS</h2>
            <p class="text-base md:text-lg text-slate-600 max-w-2xl mx-auto leading-relaxed">
                Once change talk shows up, don't let it pass. <span class="font-semibold text-ttnTrustBlue">Elaborate, Affirm, Reflect, Summarize.</span> <span class="block text-xs text-slate-500 mt-1">Click a strategy to watch the exchange unfold.</span>
            </p>
        </div>

        <!-- Interactive 2x2 EARS Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- E: Elaborate -->
            <button onclick="playEarSequence('elaborate')" id="card-elaborate" class="ears-card relative group text-left bg-white border-2 border-slate-200 rounded-3xl overflow-hidden shadow-sm focus:outline-none flex flex-col show-patient">
                <div class="relative w-full aspect-square bg-slate-900 overflow-hidden border-b border-slate-100">
                    <!-- Patient Video (Shot A) -->
                    <video id="vid-patient-elaborate" class="patient-video absolute inset-0 w-full h-full object-cover transition-opacity duration-500" muted playsinline preload="auto">
                        <source src="patient_elaborate_360p.mp4" type="video/mp4">
                    </video>
                    <!-- Premiere Pro Sequence Video (Shot A -> Shot B with Frame Hold) -->
                    <video id="vid-sequence-elaborate" class="sequence-video absolute inset-0 w-full h-full object-cover transition-all duration-500 opacity-0" muted playsinline preload="auto">
                        <source src="lindsay_elaborate_sequence.mp4" type="video/mp4">
                    </video>
                    
                    <div class="absolute top-3 right-3 z-30 pointer-events-none">
                        <div id="play-icon-elaborate" class="w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-ttnNavy shadow-md group-hover:scale-110 transition-transform">
                            <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                </div>
                <div class="p-6 md:p-8 space-y-3 flex-grow bg-white">
                    <div class="flex items-center justify-between">
                        <span class="w-10 h-10 rounded-2xl bg-ttnIceBlue text-ttnTrustBlue font-bold text-xl flex items-center justify-center shadow-inner">E</span>
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Step 1</span>
                    </div>
                    <h3 class="text-xl font-bold text-ttnNavy">Elaborate</h3>
                    <p class="text-sm text-slate-600 leading-relaxed font-medium">Ask for more. <span class="italic text-slate-800">"Tell me more about that."</span> Let the patient build the case themselves.</p>
                </div>
            </button>

            <!-- A: Affirm -->
            <button onclick="playEarSequence('affirm')" id="card-affirm" class="ears-card relative group text-left bg-white border-2 border-slate-200 rounded-3xl overflow-hidden shadow-sm focus:outline-none flex flex-col show-patient">
                <div class="relative w-full aspect-square bg-slate-900 overflow-hidden border-b border-slate-100">
                    <video id="vid-patient-affirm" class="patient-video absolute inset-0 w-full h-full object-cover transition-opacity duration-500" muted playsinline preload="auto">
                        <source src="patient_affirm_360p.mp4" type="video/mp4">
                    </video>
                    <video id="vid-sequence-affirm" class="sequence-video absolute inset-0 w-full h-full object-cover transition-all duration-500 opacity-0" muted playsinline preload="auto">
                        <source src="lindsay_affirm_sequence.mp4" type="video/mp4">
                    </video>
                    <div class="absolute top-3 right-3 z-30 pointer-events-none">
                        <div id="play-icon-affirm" class="w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-ttnNavy shadow-md group-hover:scale-110 transition-transform">
                            <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                </div>
                <div class="p-6 md:p-8 space-y-3 flex-grow bg-white">
                    <div class="flex items-center justify-between">
                        <span class="w-10 h-10 rounded-2xl bg-blue-100 text-ttnTrustBlue font-bold text-xl flex items-center justify-center shadow-inner">A</span>
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Step 2</span>
                    </div>
                    <h3 class="text-xl font-bold text-ttnNavy">Affirm</h3>
                    <p class="text-sm text-slate-600 leading-relaxed font-medium">Name the strength behind what they just said. Specific, and genuine.</p>
                </div>
            </button>

            <!-- R: Reflect -->
            <button onclick="playEarSequence('reflect')" id="card-reflect" class="ears-card relative group text-left bg-white border-2 border-slate-200 rounded-3xl overflow-hidden shadow-sm focus:outline-none flex flex-col show-patient">
                <div class="relative w-full aspect-square bg-slate-900 overflow-hidden border-b border-slate-100">
                    <video id="vid-patient-reflect" class="patient-video absolute inset-0 w-full h-full object-cover transition-opacity duration-500" muted playsinline preload="auto">
                        <source src="patient_reflect_360p.mp4" type="video/mp4">
                    </video>
                    <video id="vid-sequence-reflect" class="sequence-video absolute inset-0 w-full h-full object-cover transition-all duration-500 opacity-0" muted playsinline preload="auto">
                        <source src="lindsay_reflect_sequence.mp4" type="video/mp4">
                    </video>
                    <div class="absolute top-3 right-3 z-30 pointer-events-none">
                        <div id="play-icon-reflect" class="w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-ttnNavy shadow-md group-hover:scale-110 transition-transform">
                            <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                </div>
                <div class="p-6 md:p-8 space-y-3 flex-grow bg-white">
                    <div class="flex items-center justify-between">
                        <span class="w-10 h-10 rounded-2xl bg-orange-100 text-ttnActionOrange font-bold text-xl flex items-center justify-center shadow-inner">R</span>
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Step 3</span>
                    </div>
                    <h3 class="text-xl font-bold text-ttnNavy">Reflect</h3>
                    <p class="text-sm text-slate-600 leading-relaxed font-medium">Repeat the change talk back. Often amplified slightly, so they hear its full weight.</p>
                </div>
            </button>

            <!-- S: Summarize -->
            <button onclick="playEarSequence('summarize')" id="card-summarize" class="ears-card relative group text-left bg-white border-2 border-slate-200 rounded-3xl overflow-hidden shadow-sm focus:outline-none flex flex-col show-patient">
                <div class="relative w-full aspect-square bg-slate-900 overflow-hidden border-b border-slate-100">
                    <video id="vid-patient-summarize" class="patient-video absolute inset-0 w-full h-full object-cover transition-opacity duration-500" muted playsinline preload="auto">
                        <source src="patient_summarize_360p.mp4" type="video/mp4">
                    </video>
                    <video id="vid-sequence-summarize" class="sequence-video absolute inset-0 w-full h-full object-cover transition-all duration-500 opacity-0" muted playsinline preload="auto">
                        <source src="lindsay_summarize_sequence.mp4" type="video/mp4">
                    </video>
                    <div class="absolute top-3 right-3 z-30 pointer-events-none">
                        <div id="play-icon-summarize" class="w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-ttnNavy shadow-md group-hover:scale-110 transition-transform">
                            <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                </div>
                <div class="p-6 md:p-8 space-y-3 flex-grow bg-white">
                    <div class="flex items-center justify-between">
                        <span class="w-10 h-10 rounded-2xl bg-slate-200 text-slate-700 font-bold text-xl flex items-center justify-center shadow-inner">S</span>
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Step 4</span>
                    </div>
                    <h3 class="text-xl font-bold text-ttnNavy">Summarize</h3>
                    <p class="text-sm text-slate-600 leading-relaxed font-medium">Gather the change talk said so far into one short recap.</p>
                </div>
            </button>

        </div>

        <!-- Dynamic Example Callout Box -->
        <div id="exampleBox" class="bg-ttnActionOrange text-white rounded-2xl p-6 md:p-8 shadow-md transition-all duration-300 relative overflow-hidden hidden">
            <div class="absolute inset-0 z-0 opacity-10 bg-cover bg-center pointer-events-none" style="background-image: url('Watermark_Background.jpeg');"></div>
            
            <div class="relative z-10 space-y-2">
                <span id="exampleCategory" class="text-xs font-bold uppercase tracking-widest text-white/80">Clinical Example</span>
                <p id="exampleText" class="text-base md:text-lg font-medium leading-relaxed italic"></p>
                <span id="exampleSub" class="block text-xs text-white/90 font-semibold pt-1"></span>
            </div>
        </div>

    </div>

    <!-- Dr. Lindsay Coaching Explanation Audio Elements -->
    <audio id="audio-lindsay-elaborate-explain" src="vo_lindsay_elaborate_explain.wav"></audio>
    <audio id="audio-lindsay-affirm-explain" src="vo_lindsay_affirm_explain.wav"></audio>
    <audio id="audio-lindsay-reflect-explain" src="vo_lindsay_reflect_explain.wav"></audio>
    <audio id="audio-lindsay-summarize-explain" src="vo_lindsay_summarize_explain.wav"></audio>

    <script>
        const earsData = {
            elaborate: {
                title: "Elaborate in Practice",
                text: '"I do get out of breath a lot faster than I used to." — "What kinds of things are you noticing that with?"',
                sub: 'Dr. Lindsay: Asking for elaboration expands the window of change talk.'
            },
            affirm: {
                title: "Affirm in Practice",
                text: '"I managed to walk for ten minutes twice this week." — "It takes real commitment to stick to that routine when your joints are sore."',
                sub: 'Dr. Lindsay: Affirmations anchor their confidence.'
            },
            reflect: {
                title: "Reflect in Practice",
                text: '"I really need to get my blood pressure down for my family." — "Being around healthy for your family is what matters most right now."',
                sub: 'Dr. Lindsay: Reflections let them hear their own motivation amplified.'
            },
            summarize: {
                title: "Summarize in Practice",
                text: '"So far, you’ve mentioned wanting more energy for work and feeling concerned about your test results. Where should we start?"',
                sub: 'Dr. Lindsay: Summaries anchor the direction before moving forward.'
            }
        };

        let isPlaying = false;
        let sequenceTimeout = null;

        function stopAllMedia() {
            ['elaborate', 'affirm', 'reflect', 'summarize'].forEach(k => {
                const pVid = document.getElementById(`vid-patient-${k}`);
                const seqVid = document.getElementById(`vid-sequence-${k}`);
                const explainAudio = document.getElementById(`audio-lindsay-${k}-explain`);

                if (pVid) { pVid.pause(); pVid.currentTime = 0; }
                if (seqVid) { seqVid.pause(); seqVid.currentTime = 0; }
                if (explainAudio) { explainAudio.pause(); explainAudio.currentTime = 0; explainAudio.onended = null; }
            });
            if (sequenceTimeout) clearTimeout(sequenceTimeout);
        }

        function resetCards() {
            ['elaborate', 'affirm', 'reflect', 'summarize'].forEach(k => {
                const btn = document.getElementById(`card-${k}`);
                btn.classList.remove('ring-4', 'ring-ttnTrustBlue/20', 'border-ttnTrustBlue');
                document.getElementById(`play-icon-${k}`).innerHTML = '<svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            });
        }

        function playEarSequence(key) {
            if (isPlaying) stopAllMedia();
            resetCards();
            isPlaying = true;

            const card = document.getElementById(`card-${key}`);
            const playIcon = document.getElementById(`play-icon-${key}`);
            
            const patientVid = document.getElementById(`vid-patient-${key}`);
            const sequenceVid = document.getElementById(`vid-sequence-${key}`);
            const explainAudio = document.getElementById(`audio-lindsay-${key}-explain`);

            // Activate card visual state
            card.classList.add('ring-4', 'ring-ttnTrustBlue/20', 'border-ttnTrustBlue');
            playIcon.innerHTML = `<svg class="w-5 h-5 text-ttnTrustBlue animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>`;

            // Populate and show example box
            const box = document.getElementById('exampleBox');
            document.getElementById('exampleCategory').textContent = earsData[key].title;
            document.getElementById('exampleText').textContent = earsData[key].text;
            document.getElementById('exampleSub').textContent = earsData[key].sub;
            box.classList.remove('hidden');

            // 1. Play Shot A (Patient video)
            card.classList.remove('show-sequence');
            card.classList.add('show-patient');
            patientVid.currentTime = 0;
            patientVid.play().catch(e => console.warn("Patient video blocked:", e));

            // When Patient video finishes Shot A, transition to Sequence Video (Shot B + Frame Hold)
            patientVid.onended = () => {
                card.classList.remove('show-patient');
                card.classList.add('show-sequence');
                sequenceVid.currentTime = 0;
                sequenceVid.play().catch(e => console.warn("Sequence video blocked:", e));
            };

            // When Sequence video finishes its dialogue and hits the frame hold, trigger Dr. Lindsay's coaching explanation voiceover
            sequenceVid.onended = () => {
                // 1.0s natural pause before Dr. Lindsay's coaching explanation voiceover begins
                sequenceTimeout = setTimeout(() => {
                    explainAudio.currentTime = 0;
                    explainAudio.play().catch(e => console.warn("Explanation audio blocked:", e));

                    explainAudio.onended = () => {
                        isPlaying = false;
                        playIcon.innerHTML = '<svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                    };
                }, 1000);
            };
        }
    </script>
</body>
</html>
